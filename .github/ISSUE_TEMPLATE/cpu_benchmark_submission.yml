name: "📊 Submit CPU Benchmark (./modchip bench / check_cpu_readiness.py)"
description: "Share your CPU or Hybrid GPU+CPU scorecard to be added to the Official llama-modchip Leaderboard!"
title: "[Benchmark] <CPU Model> — <tok/s> on <Model>"
labels: ["benchmark", "leaderboard"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🏆 Submit Your CPU or Hybrid GPU+CPU Scorecard!
        Run either the 2-second zero-download readiness check (evaluates both 30B and 284B 64GB RAM headroom):
        ```bash
        curl -sL https://raw.githubusercontent.com/synchopate/llama-modchip/main/scripts/check_cpu_readiness.py | python3
        ```
        or the live 30-second model benchmark (which prints a pre-filled submission link):
        ```bash
        ./modchip bench
        ```
        and paste your output below!

  - type: input
    id: cpu_model
    attributes:
      label: "CPU Model & Architecture (plus optional GPU if Hybrid)"
      description: "e.g., AMD Ryzen 9 9955HX / 9950X (Zen 5, 16C/32T), Threadripper PRO 7985WX, AWS Graviton3/4, Apple M4 Pro"
      placeholder: "AMD Ryzen 9 9955HX (16C/32T Zen 5, 64 MB L3, 0 GPUs)"
    validations:
      required: true

  - type: input
    id: ram_spec
    attributes:
      label: "Total System RAM & Memory Speed"
      description: "e.g., 64 GB DDR5-5600 Dual-Channel, 128 GB DDR5-6000, 24 GB Unified"
      placeholder: "64 GB DDR5-5600"
    validations:
      required: true

  - type: dropdown
    id: model_tested
    attributes:
      label: "Model / Tool Tested"
      options:
        - "Qwen3.8-Flash-Next-MaxQ-64GB (176.5B Total / 5B Active, 53.99 GiB — Aligned Flagship 64GB)"
        - "Qwen3.8-Flash-Next-MaxQ-64GB-Abliterated (v3.0-r2 Heretic-2, 53.99 GiB — Opt-In Uncensored)"
        - "Qwen3.8-Flash-Next-MaxQ-32GB (176.5B Total / 5B Active, 35.71 GiB — Aligned 32GB Laptop)"
        - "Qwen3.8-Flash-Next-MaxQ-32GB-Abliterated (v3.0-r2 Heretic-2, 35.71 GiB — Opt-In Uncensored)"
        - "DeepSeek-V4-Flash-0731-MaxQ-v4 (284.33B Total / 13.17B Active, 57.99 GiB — 64GB Standard ggml)"
        - "NVIDIA-Nemotron-3.5-30B-A3B-VQ3-64 (30.2B Total / 3.0B Active, 13.30 GiB — 16GB AVX-512 Turbo)"
        - "NVIDIA-Nemotron-3.5-30B-A3B-MaxQ-16GB (30.2B Total / 3.0B Active, 13.39 GiB — 16GB Standard ggml)"
        - "NVIDIA-Nemotron-3.5-30B-A3B-Abliterated-VQ3-64 (13.30 GiB — Opt-In Uncensored)"
        - "NVIDIA-Nemotron-3.5-30B-A3B-Fractal-64 (14.36 GiB) / Fractal-MXFP4 (15.95 GiB)"
        - "NVIDIA-Nemotron-3.5-30B-A3B-Q4_0 (17.60 GiB)"
        - "Qwen3-30B-A3B / Qwen3-14B (Hybrid GPU+CPU)"
        - "2-Second CPU Readiness Check (check_cpu_readiness.py)"
    validations:
      required: true

  - type: textarea
    id: terminal_output
    attributes:
      label: "Terminal Output Paste"
      description: "Paste the full output of ./modchip bench or check_cpu_readiness.py"
      render: shell
    validations:
      required: true
